<script type="application/json" id="contenido">{"juego": {"clave": "dfz-juego-u4-l2", "niveles": ["Observador", "Analista", "Investigador forense", "Referente en búsqueda"]}, "ilustraciones": "ilustraciones-desaparicion", "paleta": {"marino": "#07415C", "teal": "#4B798E", "oxido": "#37687F", "coral": "#90B1C0", "crema": "#FEE0D8", "niebla": "#A9D6CE", "hielo": "#E3F2F5", "celeste": "#A9D6CE", "madera": "#37687F", "piso": "#A9D6CE", "gris": "#A9D6CE", "amarillo": "#90B1C0"}, "anclas": {}, "respiro": 360, "pagina": 440, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "dfz", "partirComas": true, "bitacora": true, "rellenoHoja": true, "ventanaAmplia": true, "desplazarLectura": true, "retro": {"reacciones": [], "frases": ["¿Seguro?", "¡Revise de nuevo!", "¡Mire otra vez!", "¡Casi!"], "acierto": [], "rotulo": "Unidad 4 · Lección 2"}, "leccion_rotulo": "Lección 2", "unit": 4, "lesson": 2, "heading": "Lección 2. El primer contacto con las víctimas y sus familiares", "scenes": [{"layout": "compacta", "segmentos": ["Objetivo de la Lección: Aplicar pautas de conducta, recepción digna y empatía situacional durante las entrevistas iniciales a familiares.", "El primer contacto institucional condiciona la confianza en el sistema. La entrevista a familiares cumple una doble función: investigativa (obtención de datos AM (Ante Morten) y trayectoria) así como humanitaria. Debe realizarse en espacios privados, con lenguaje claro, escuchando sin juzgar, respetando el dolor y explicando con transparencia el uso que se dará a la información.", "El primer contacto institucional condiciona la confianza de los familiares en el sistema de justicia. Debe desarrollarse bajo principios de recepción digna, empatía situacional, escucha respetuosa y ausencia de prejuicios.", "En la desaparición forzada debe reconocerse que la entrevista a familiares tiene una característica particular: puede cumplir simultáneamente una función investigativa y una función humanitaria. El familiar no es simplemente una fuente de información. Es una persona afectada por la desaparición. Por ello, el investigador debe evitar convertir la entrevista en una experiencia innecesariamente revictimizante. El Protocolo de Minnesota establece que debe prestarse especial cuidado al entrevistar personas en duelo o quienes han presenciado delitos, precisamente para reducir el riesgo de retraumatización. Esto implica: evitar preguntas innecesariamente repetitivas, explicar por qué se necesita determinada información, respetar pausas, evitar juicios, no generar expectativas que no puedan cumplirse, explicar qué ocurrirá con la información, y mantener comunicación responsable sobre avances y limitaciones. El CICR también destaca la necesidad de establecer y mantener una relación de confianza con los familiares durante el proceso de búsqueda."], "parrafo": [0, 1, 2, 3], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 23}, {"t": "p", "s": [1], "c": "", "n": 0}, {"t": "sub", "x": "Protocolos de atención inicial, recepción digna y empatía situacional"}, {"t": "p", "s": [2], "c": "", "n": 0}, {"t": "sub", "x": "Entrevista de familiares: una doble finalidad"}, {"t": "p", "s": [3], "c": "", "n": 0}], "items": [{"label": "El primer contacto con las víctimas y sus familiares", "segs": [0, 1, 2, 3], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["personas", "documento", "carpetas"], "escenario": true}], "rotulo": null, "seccion": "Lección 2. El primer contacto con las víctimas y sus familiares", "grupo": null, "titulos_fuente": ["Lección 2. El primer contacto con las víctimas y sus familiares", "Protocolos de atención inicial, recepción digna y empatía situacional", "Entrevista de familiares: una doble finalidad"], "encabezados": [], "mediacion": "Página compacta: lectura en una columna, subtítulos de la ficha", "rotul
