<script type="application/json" id="contenido">{"juego": {"clave": "dfz-juego-u2-l3", "niveles": ["Observador", "Analista", "Investigador forense", "Referente en búsqueda"]}, "ilustraciones": "ilustraciones-desaparicion", "paleta": {"marino": "#07415C", "teal": "#4B798E", "oxido": "#37687F", "coral": "#90B1C0", "crema": "#FEE0D8", "niebla": "#A9D6CE", "hielo": "#E3F2F5", "celeste": "#A9D6CE", "madera": "#37687F", "piso": "#A9D6CE", "gris": "#A9D6CE", "amarillo": "#90B1C0"}, "anclas": {}, "respiro": 360, "pagina": 440, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "dfz", "partirComas": true, "bitacora": true, "rellenoHoja": true, "ventanaAmplia": true, "desplazarLectura": true, "retro": {"reacciones": [], "frases": ["¿Seguro?", "¡Revise de nuevo!", "¡Mire otra vez!", "¡Casi!"], "acierto": [], "rotulo": "Unidad 2 · Lección 3"}, "leccion_rotulo": "Lección 3", "unit": 2, "lesson": 3, "heading": "Lección 3. Alerta Rosa: supuestos de activación, población protegida y articulación interinstitucional (Ley 2326 de 2023, Decreto 1428 de 2024)", "scenes": [{"layout": "compacta", "segmentos": ["Objetivo de la Lección: Conocer la estructura operativa, supuestos normativos, población protegida y canales de difusión masiva multicanal de la Alerta Rosa, identificando las funciones de la Fiscalía General de la Nación en el Comité de Coordinación Nacional y su rol articulador con la Fuerza Pública y la sociedad civil.", "La Alerta Rosa, creada por la Ley 2326 de 2023 y reglamentada mediante el Decreto 1428 de 2024, constituye un mecanismo operativo y tecnológico de respuesta inmediata, emergencia y difusión masiva multicanal. Su propósito central es movilizar en tiempo real a la institucionalidad, los medios de comunicación, las empresas de telefonía móvil y la ciudadanía en general para lograr la ubicación con vida de niños, niñas, adolescentes, jóvenes (hasta los 28 años) y mujeres reportadas como desaparecidas."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 23}, {"t": "p", "s": [1], "c": "", "n": 0}], "items": [{"label": "Objetivo de la lección", "segs": [0, 1], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["megafono", "telefono", "personas"], "escenario": true}], "rotulo": null, "seccion": "Lección 3. Alerta Rosa: supuestos de activación, población protegida y articulación interinstitucional (Ley 2326 de 2023, Decreto 1428 de 2024)", "grupo": null, "titulos_fuente": ["Lección 3. Alerta Rosa: supuestos de activación, población protegida y articulación interinstitucional (Ley 2326 de 2023, Decreto 1428 de 2024)"], "encabezados": [], "mediacion": "Página compacta: lectura en una columna", "rotulos": ["Objetivo de la lección"], "titulo_genially": "Objetivo de la lección", "complemento_genially": "", "apartado": "", "bloques_fuente": [68, 69], "guia": "Lea el contenido; si continúa, baje con la barra de desplazamiento para verlo completo."}, {"layout": "compacta", "segmentos": ["La Alerta Rosa funciona como un sistema nacional interconectado que se activa de forma simultánea a la recepción de la denuncia o solicitud ante la FGN o la Policía Nacional. La Fiscalía General de la Nación ejerce la Secretaría Técnica del Comité de Coordinación Nacional de la Alerta Rosa, correspondiéndole coordinar la emisión inmediata del boletín de emergencia que contiene la fotografía, rasgos morfológicos, prendas de vestir y última ubicación conocida de la persona desaparecida.", "La difusión multicanal abarca los siguientes ejes tecnológicos e institucionales:", "1. Redes de Telefonía Móvil: Envío masivo de mensajes de texto (SMS) y alertas de emergencia geo-fijadas a los teléfonos celulares de los ciudadanos ubicados en el municipio o departamento del evento.", "2. Medios de comunicación masiva: Transmisión obligatoria e inmediata en canales de televisión abierta, radio nacional, regional y comunitaria, y plataformas digitales de noticias.", "3. Pantallas de Información en Transporte y Vías Públicas: Despliegue del boletín en terminales de transporte terrestre, aeropuertos, estaciones de transporte masivo (Transmilenio, Metro, MIO, etc.), peajes viales y paneles LED informativos.", "4. Redes Sociales Institucionales y Aplicativos Ciudadanos: Publicación oficial y compartición prioritaria en las cuentas verificadas de la FGN, Policía Nacional, Ministerio del Interior, Alcaldías y Gobernaciones.", "5. Alerta Fronteriza e Interpol: Notificación inmediata a Puestos de Control Migratorio (Migración Colombia) y emisión de Notificación Amarilla de Interpol para evitar la salida ilegal del país."], "parrafo": [0, 1, 2, 3, 4, 5, 6], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "", "n": 0}, {"t": "p", "s": [2], "c": "", "n": 0}, {"t": "p", "s": [3], "c": "", "n": 0}, {"t": "p", "s": [4], "c": "", "n": 0}, {"t": "p", "s": [5], "c": "", "n": 0}, {"t": "p", "s": [6], "c": "", "n": 0}], "items": [{"label": "Mecanismo Operativo y de Difusión Masiva Multicanal de Emergencia (Alerta Rosa)", "segs": [0, 1, 2, 3, 4, 5, 6], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["expediente", "personas", "lupa"], "escenario": true}], "rotulo": null, "seccion": "1. Mecanismo Operativo y de Difusión Masiva Multicanal de Emergencia (Alerta Rosa)", "grupo": null, "titulos_fuente": ["1. Mecanismo Operativo y de Difusión Masiva Multicanal de Emergencia (Alerta Rosa)"], "encabezados": [], "mediacion": "Página compacta: lectura en una columna", "rotulos": ["Mecanismo Operativo y de Difusión Masiva Multicanal de Emergencia (Alerta Rosa)"], "titulo_genially": "Mecanismo Operativo y de Difusión Masiva Multicanal de Emergencia (Alerta Rosa)", "complemento_genially": "", "apartado": "1. Mecanismo Operativo y de Difusión Masiva Multicanal de Emergencia (Alerta Rosa)", "bloques_fuente": [70, 77], "guia": "Lea el contenido; si continúa, baje con la barra de desplazamiento para verlo completo.", "descarga": {"href": "documentos/mapa-u2-l3-p02.png", "rotulo": "Clic para descargar el mapa", "nombre": "Mapa conceptual: Mecanismo Operativo y de Difusión Masiva Multicanal de Emergencia (Alerta Rosa) (imagen PNG)", "lamina": true}}, {"layout": "compacta", "segmentos": ["De acuerdo con la Ley 2326 de 2023 y su reglamentación mediante el Decreto 1428 de 2024, la Alerta Rosa está dirigida a la búsqueda inmediata y la protección de niñas, niños, adolescentes, jóvenes y mujeres que se encuentren desaparecidos, reconociendo las condiciones de vulnerabilidad y los riesgos diferenciales que pueden afectar a estas poblaciones.", "De conformidad con estas disposiciones, la población comprendida es:", "Niñas, niños y adolescentes: personas de 0 a 17 años, sin distinción de sexo.", "Jóvenes: personas entre los 14 y los 28 años, de acuerdo con la definición legal de juventud.", "Mujeres: mujeres de todas las edades, incluidas las mujeres trans.", "La atención de estos casos debe considerar las circunstancias particulares de cada persona y sus necesidades específicas. En el caso de las personas con discapacidad, el artículo 9 de la Ley 2326 de 2023 establece que deben atenderse sus necesidades particulares durante las actuaciones correspondientes, sin que ello implique incorporarlas como una categoría poblacional independiente de las expresamente previstas para la Alerta Rosa.", "La Alerta Rosa debe ser considerada desde el momento en que se recibe cualquier reporte de desaparición de una niña, niño, adolescente, joven o mujer, sin exigir que previamente se demuestre la existencia de amenazas, violencia o la comisión de un delito. La autoridad competente debe recibir y registrar inmediatamente el reporte, recopilar la información necesaria y remitirlo a la Secretaría Ejecutiva de la Alerta Rosa para que evalúe los criterios de activación establecidos en el artículo 2.2.2.8.3.12 del Decreto 1428 de 2024; entre estos criterios se encuentra la valoración de la situación de alto riesgo inminente, de acuerdo con los factores previstos en el artículo referido.", "La activación de la Alerta Rosa no excluye ni reemplaza el Mecanismo de Búsqueda Urgente (MBU). Por el contrario, ambos mecanismos deben articularse cuando corresponda, de manera que se fortalezcan las acciones de búsqueda, localización y protección de la persona desaparecida. La búsqueda no debe retrasarse mientras se determina la eventual configuración de una conducta delictiva.", "Ante la desaparición de una mujer, niño, niña o adolescente, la FGN debe activar en el mismo acto procesal tanto el MBU (Ley 971/05) como la Alerta Rosa (Ley 2326/23). La duplicidad estratégica garantiza búsqueda judicial sobre el terreno y difusión masiva tecnológica en tiempo real."], "parrafo": [0, 1, 2, 3, 4, 5, 6, 7, 8], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "", "n": 0}, {"t": "lista", "s": [2, 3, 4], "n": [0, 0, 0]}, {"t": "p", "s": [5], "c": "", "n": 0}, {"t": "p", "s": [6], "c": "", "n": 0}, {"t": "p", "s": [7], "c": "", "n": 0}, {"t": "sub", "x": "Alerta normativa: Concurrencia MBU + Alerta Rosa"}, {"t": "p", "s": [8], "c": "", "n": 0}], "items": [{"label": "Población Protegida y Criterios de Activación", "segs": [0, 1, 2, 3, 4, 5, 6, 7, 8], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["telefono", "documento", "personas"], "escenario": true}], "rotulo": null, "seccion": "2. Población Protegida y Criterios de Activación", "grupo": null, "titulos_fuente": ["2. Población Protegida y Criterios de Activación", "Alerta normativa: Concurrencia MBU + Alerta Rosa"], "encabezados": [], "mediacion": "Página compacta: lis
