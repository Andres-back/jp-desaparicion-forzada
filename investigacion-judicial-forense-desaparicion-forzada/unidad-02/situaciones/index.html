<script type="application/json" id="datos">{"unidad": 2, "situaciones": {"F": {"titulo": "El primer contacto", "unidad": 2, "leccion": 4, "rotulo": "Actividad práctica: primer contacto y registro en el RND - SIRDEC", "reflexion": false, "contexto": "<p>El 15 de marzo de 2026, a las 08:30 hrs, la Sra. Rosa Elena Morales acude en estado de alta vulnerabilidad emocional a la oficina de recepción de denuncias. Refiere que su hijo Carlos Alberto Morales (34 años, transportador rural y líder comunal) no llegó a pernoctar tras salir hacia la vereda La Esperanza en su camioneta Toyota Hilux (placas XYZ-789). Manifiesta que su teléfono celular pasa directamente a buzón desde las 19:12 hrs del día anterior.<\/p>", "consigna": "<p>Como servidor de primer contacto de la fiscalía general de la Nación:<\/p><ol><li>¿Cómo debe conducir la interacción comunicativa para evitar la revictimización y garantizar la recepción digna?<\/li><li>¿Qué datos filiatorios, morfológicos y de prendas (Información Ante Mortem - AM) son de recolección obligatoria e inmediata?<\/li><li>¿Cuál es el procedimiento obligatorio frente al Registro Nacional de Desaparecidos (RND - SIRDEC)?<\/li><\/ol>", "opciones": [{"letra": "A", "texto": "Sugerir a la madre regresar a su vivienda a verificar si su hijo se comunicó, argumentando que no han transcurrido 24 horas desde la ausencia", "textoPlano": "Sugerir a la madre regresar a su vivienda a verificar si su hijo se comunicó, argumentando que no han transcurrido 24 horas desde la ausencia", "retro": "<p><strong>Incorrecto.<\/strong> Exigir lapsos de espera o condicionar la recepción del reporte vulnera de manera grave el estándar de debida diligencia e inmediatez (Arts. 12 y 250 C.P.; Ley 971 de 2005). La inacción en las primeras horas provoca la pérdida irreparable de evidencia volátil (celdas de telefonía y registros de cámaras).<\/p>", "correcta": false}, {"letra": "B", "texto": "Acoger a la ciudadana en espacio privado, brindar escucha empática sin prejuzgar la conducta de la víctima, diligenciar el formato de primer contacto con datos AM e ingresar la información de inmediato al RND/SIRDEC", "textoPlano": "Acoger a la ciudadana en espacio privado, brindar escucha empática sin prejuzgar la conducta de la víctima, diligenciar el formato de primer contacto con datos AM e ingresar la información de inmediato al RND/SIRDEC", "retro": "<p><strong>¡Correcto!<\/strong> El primer contacto exige empatía situacional y acción sin daño. El servidor debe recolectar la Información Ante Mortem (AM) —filiación, cicatrices, prendas, odontología, datos del vehículo y dispositivos móviles— y registrarla de oficio y sin dilación en el Registro Nacional de Desaparecidos (RND - SIRDEC), activando la alerta nacional de búsqueda.<\/p>", "correcta": true}], "plantilla": "", "pregunta": "", "retroPregunta": "", "video": "", "videoDisponible": false, "imagen": "img/dfz-situacion-f.jpg"}, "G": {"titulo": "La vocera", "unidad": 2, "leccion": 4, "rotulo": "Actividad práctica: MBU y Alerta Rosa", "reflexion": false, "contexto": "<p>El 28 de mayo de 2026, la adolescente <strong>Mariana Morales (16 años)<\/strong>, hermana menor de Carlos Alberto y vocera del colectivo de víctimas, asiste a la diligencia de exhumación en la <em>Finca El Vergel<\/em> y entrega declaraciones a medios locales exigiendo justicia. A las 18:00 hrs de ese mismo día no regresa a su domicilio. Su teléfono celular es desconectado tras recibir mensajes intimidantes de texto. La familia acude de inmediato a la fiscalía general de la Nación a reportar su desaparición y solicitar auxilio urgente.<\/p>", "consigna": "<p>Con base en la información del Sub-caso <strong>I-09<\/strong> y en el marco normativo estudiado en la Unidad 2, analice la situación de Mariana Morales y complete la siguiente <strong>Matriz de Decisión Operativa<\/strong>. Debe determinar si procede el MBU, la Alerta Rosa o ambos de manera simultánea, justificando la competencia de las autoridades y las acciones de búsqueda inmediata requeridas.<\/p><ol><li>¿Qué norma y mecanismo protege a Mariana?<\/li><li>¿Quién es la autoridad competente?<\/li><li>¿Se debe activar el MBU, la Alerta Rosa o ambos simultáneamente? Justifique su respuesta.<\/li><\/ol>", "opciones": [], "plantilla": "<div class=\"tabla-marco\"><table class=\"tabla\"><tr><th scope=\"col\"><strong>Criterio de Análisis<\/strong><\/th><th scope=\"col\"><strong>Mecanismo de Búsqueda Urgente (MBU)<\/strong><\/th><th scope=\"col\"><strong>Alerta Rosa<\/strong><\/th><\/tr><tr><td>Fundamento Legal<\/td><td>(Indique la ley que reglamenta el mecanismo)<\/td><td>(Indique la ley y decreto reglamentario)<\/td><\/tr><tr><td>Naturaleza del Mecanismo<\/td><td>(Describa el carácter tutelar, judicial o de difusión)<\/td><td>(Describa el carácter operativo y tecnológico)<\/td><\/tr><tr><td>Población Protegida<\/td><td>(¿A quiénes protege este mecanismo?)<\/td><td>(¿A qué población específica está dirigido?)<\/td><\/tr><tr><td>Autoridad Competente<\/td><td>(¿Quién ordena y lidera el procedimiento?)<\/td><td>(¿Quién coordina el protocolo de activación?)<\/td><\/tr><tr><td>Facultades / Acciones Inmediatas<\/td><td>(Describa las acciones principales que autoriza)<\/td><td>(Describa los canales y medios que activa)<\/td><\/tr><tr><td>Evaluación de Procedencia en el Sub-caso I-09<\/td><td>¿Procede en el caso de Mariana Morales? <em>(Si / No y justificación corta)<\/em><\/td><td>(Describa los canales y medios que activa)<\/td><\/tr><\/table><\/div>", "pregunta": "<p>¿Debe la autoridad elegir uno de los dos mecanismos o es jurídicamente obligatorio activarlos de manera simultánea? Justifique su respuesta bajo el estándar de debida diligencia e inmediatez.<\/p>", "retroPregunta": "<p>La búsqueda de emergencia exige comprender la coexistencia no excluyente de ambos mecanismos:<\/p><ul><li>No existe exclusión entre el MBU y la Alerta Rosa. Mientras el <strong>MBU<\/strong> opera en la esfera judicial-tutelar para ordenar inspecciones y levantamiento de reservas, la <strong>Alerta Rosa<\/strong> genera la movilización masiva de la sociedad y los medios tecnológicos en tiempo real.<\/li><li>Omitir cualquiera de los dos instrumentos ante la desaparición de una menor amenazada constituye una falla grave al estándar de <strong>debida diligencia reforzada<\/strong> (Corte IDH, Caso <em>Campo Algodonero vs. México<\/em>).<\/li><\/ul>", "video": "medios/dfz-situacion-g.mp4", "videoDisponible": true, "imagen": "img/dfz-situacion-g.jpg", "plantillaTitulo": "Plantilla descargable", "plantillaNombre": "Matriz de Decisión Operativa", "xlsx": "documentos/dfz-situacion-g-matriz-decision-operativa.xlsx", "xlsxPeso": "6 KB"}}}</script>
