<script type="application/json" id="contenido">{"juego": {"clave": "dfz-juego-u2-l1", "niveles": ["Observador", "Analista", "Investigador forense", "Referente en búsqueda"]}, "ilustraciones": "ilustraciones-desaparicion", "paleta": {"marino": "#07415C", "teal": "#4B798E", "oxido": "#37687F", "coral": "#90B1C0", "crema": "#FEE0D8", "niebla": "#A9D6CE", "hielo": "#E3F2F5", "celeste": "#A9D6CE", "madera": "#37687F", "piso": "#A9D6CE", "gris": "#A9D6CE", "amarillo": "#90B1C0"}, "anclas": {}, "respiro": 360, "pagina": 440, "completar": true, "sinHuecos": true, "tituloFuera": true, "marco": [1113, 448], "clave_curso": "dfz", "partirComas": true, "bitacora": true, "rellenoHoja": true, "ventanaAmplia": true, "desplazarLectura": true, "retro": {"reacciones": [], "frases": ["¿Seguro?", "¡Revise de nuevo!", "¡Mire otra vez!", "¡Casi!"], "acierto": [], "rotulo": "Unidad 2 · Lección 1"}, "leccion_rotulo": "Lección 1", "unit": 2, "lesson": 1, "heading": "Lección 1. Mecanismo de Búsqueda Urgente: naturaleza, titulares, términos, autoridades competentes y trámite (Ley 971 de 2005)", "scenes": [{"layout": "lamina", "segmentos": ["Objetivo de la Lección: Comprender la naturaleza jurídica, cautelar, tutelar e independiente del Mecanismo de Búsqueda Urgente (MBU) consagrado en la Ley 971 de 2005, así como dominar el procedimiento de activación inmediata, términos perentorios y facultades extraordinarias de inspección judicial que competen a la Fiscalía General de la Nación."], "parrafo": [0], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "lamina", "items": [{"label": "Mecanismo de Búsqueda Urgente: naturaleza, titulares, términos, autoridades competentes y trámite (Ley 971 de 2005)", "segs": [0], "obj": "libros", "acomp": ["reloj", "lupa"]}]}], "rotulo": null, "seccion": "Lección 1. Mecanismo de Búsqueda Urgente: naturaleza, titulares, términos, autoridades competentes y trámite (Ley 971 de 2005)", "grupo": null, "titulos_fuente": [], "encabezados": [], "mediacion": "Escenario ilustrado con puntos sobre los objetos.", "rotulos": ["Mecanismo de Búsqueda Urgente: naturaleza, titulares, términos, autoridades competentes y trámite (Ley 971 de 2005)"], "titulo_genially": "Objetivo de la lección", "complemento_genially": "", "apartado": "", "ilustracion": "dfz-u2-l1-e01.webp", "bloques_fuente": [31, 31]}, {"layout": "compacta", "segmentos": ["El Mecanismo de Búsqueda Urgente (MBU) tiene su origen en el artículo 13 de la Ley 589 de 2000 y fue reglamentado mediante la Ley Estatutaria 971 de 2005. Constituye un mecanismo de carácter preventivo y tutelar, orientado a garantizar la búsqueda inmediata de las personas respecto de quienes se presume que han sido desaparecidas, mediante la adopción urgente de las medidas necesarias para establecer su suerte y paradero. Su aplicación responde al deber estatal de proteger la vida, la libertad y la integridad personal, y no está condicionada al transcurso de un plazo determinado ni a la calificación jurídica definitiva de los hechos. Su objeto exclusivo es prevenir la comisión del delito de desaparición forzada o poner fin a su ejecución mediante la localización inmediata de la persona reportada como desaparecida. Desde la dogmática funcional de la Fiscalía General de la Nación, el MBU es la herramienta tutelar por excelencia para proteger de manera inminente los derechos fundamentales a la vida, la libertad personal, la integridad física y la personalidad jurídica.", "La Corte Constitucional, en Sentencias C-473 de 2005, SU-168 de 2023 y SU-297 de 2023, ha reafirmado que el MBU posee una naturaleza judicial autónoma. Esta autonomía implica que la búsqueda no se subordina a la identificación previa de posibles autores o partícipes, no requiere la calificación formal de la noticia criminal en SPOA, ni se suspende por decisiones procesales de archivo preprocesal. El eje del MBU es eminentemente protector y restaurador: la persona desaparecida es buscada bajo el principio constitucional de presunción de vida, obligando a las autoridades a desplegar todas las capacidades del Estado de manera oficiosa, gratuita, informal y permanente."], "parrafo": [0, 1], "vineta": [], "lead": [], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "compacta", "flujo": [{"t": "p", "s": [0], "c": "", "n": 0}, {"t": "p", "s": [1], "c": "", "n": 0}], "items": [{"label": "Naturaleza Estrictamente Judicial y Tutelar del Mecanismo de Búsqueda Urgente (MBU)", "segs": [0, 1], "clase": "flujo", "obj": "documento"}], "lado": [], "roles": {"repetidos": []}, "objetos": ["expediente", "personas", "lupa"]}], "rotulo": null, "seccion": "1. Naturaleza Estrictamente Judicial y Tutelar del Mecanismo de Búsqueda Urgente (MBU)", "grupo": null, "titulos_fuente": ["1. Naturaleza Estrictamente Judicial y Tutelar del Mecanismo de Búsqueda Urgente (MBU)"], "encabezados": [], "mediacion": "Página compacta: lectura en una columna", "rotulos": ["Naturaleza Estrictamente Judicial y Tutelar del Mecanismo de Búsqueda Urgente (MBU)"], "titulo_genially": "Naturaleza Estrictamente Judicial y Tutelar del Mecanismo de Búsqueda Urgente (MBU)", "complemento_genially": "", "apartado": "1. Naturaleza Estrictamente Judicial y Tutelar del Mecanismo de Búsqueda Urgente (MBU)", "bloques_fuente": [32, 34], "guia": "Lea el contenido; si continúa, baje con la barra de desplazamiento para verlo completo."}, {"layout": "esquema", "segmentos": ["La activación del MBU procede a partir del segundo cero en que la autoridad judicial o la FGN tiene conocimiento, por cualquier medio (verbal, escrito, anónimo o de oficio), del reporte de desaparición de una persona. Queda categóricamente proscrita cualquier exigencia de plazos de espera o formalidades técnico-jurídicas, eliminando la barrera revictimizante de las '72 horas'. La legitimación activa es universal: puede solicitarlo la víctima directa, sus familiares, allegados, organizaciones defensoras de derechos humanos o cualquier ciudadano.", "Recibida la solicitud, el Fiscal o la autoridad judicial activará de inmediato el MBU mediante Auto Interlocutorio y librará órdenes de trabajo urgente a la Policía Judicial (CTI/DIJIN/GAULA). El procedimiento comprende las siguientes actuaciones perentorias e ininterrumpidas:", "1. Ingreso obligatorio e inmediato de los datos filiatorios en el Formato Único de Personas Desaparecidas (FUPD) e interconexión con el SIRDEC del INMLCF.", "2. Inspección in situ e inmediata a instalaciones públicas, cuarteles, estaciones de policía, CAI, centros de detención, clínicas, hospitales y salas de patología forense.", "3. Revisión irrestricta de libros de guardia, minutas de población, libros de registro de detenidos y bitácoras de patrullaje en unidades de la fuerza pública, sin que pueda alegarse reserva militar o de seguridad nacional (Art. 7.º Ley 971 de 2005).", "4. Rendición obligatoria de informes periódicos cada 24 horas por parte del funcionario encargado hacia los familiares o solicitantes, garantizando el derecho a la información sobre los avances.", "5. Vigencia ininterrumpida e indefinida: el MBU permanece activo hasta tanto la persona sea localizada viva o se identifiquen científicamente sus restos mortales.", "El MBU es una garantía tutelar e ineludible de la FGN. Toda autoridad que dilate su activación aduciendo plazos de espera o exigiendo apoderado judicial incurre en falta disciplinaria gravísima y eventual responsabilidad penal por prevaricato por omisión."], "parrafo": [0, 1, 2, 3, 4, 5, 6, 7], "vineta": [], "lead": [0, 1], "titulo": [], "tail": [], "chips": [], "bloques": [{"tipo": "esquema", "items": [{"label": "Ingreso de los datos filiatorios en el FUPD y el SIRDEC", "segs": [2], "obj": "computador"}, {"label": "Inspección in situ e inmediata a instalaciones públicas", "segs": [3], "obj": "comisaria"}, {"label": "Revisión irrestricta de libros de guardia y minutas", "segs": [4], "obj": "libros"}, {"label": "Informes periódicos cada 24 horas a los familiares", "segs": [5], "obj": "reloj"}, {"label": "Vigencia ininterrumpida e indefinida", "segs": [6], "obj": "lupa"}, {"label": "Regla procesal de activación inmediata (MBU)", "segs": [7], "obj": "escudo"}]}], "rotulo": "Activación Inmediata, Términos y Procedimiento del MBU en la FGN", "seccion": "2. Activación Inmediata, Términos y Procedimiento del MBU en la FGN", "grupo": null, "titulos_fuente": ["2. Activación Inmediata, Términos y Procedimiento del MBU en la FGN", "Regla procesal de activación inmediata (MBU)"], "encabezados": [], "mediacion": "Mapa conceptual: la idea de la escena arriba y sus conceptos unidos debajo; cada uno abre su texto.", "rotulos": ["Ingreso de los datos filiatorios en el FUPD y el SIRDEC", "Inspección in situ e inmediata a instalaciones públicas", "Revisión irrestricta de libros de guardia y minutas", "Informes periódicos cada 24 horas a los familiares", "Vigencia ininterrumpida e indefinida", "Regla procesal de activación inmediata (MBU)"], "titulo_genially": "Activación Inmediata, Términos y Procedimiento del MBU en la FGN", "complemento_genially": "", "apartado": "2. Activación Inmediata, Términos y Procedimiento del MBU en la FGN", "bloques_fuente": [35, 44], "objeto_raiz": "reloj", "objetos_raiz": ["reloj", "escalones", "personas"], "descarga": {"href": "documentos/mapa-u2-l1-p03.png", "rotulo": "Clic para descargar el mapa", "nombre": "Mapa conceptual: Activación Inmediata, Términos y Procedimiento del MBU en la FGN (imagen PNG)", "lamina": true}}]}</script>
