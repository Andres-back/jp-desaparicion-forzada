<script type="application/json" id="datos">{"unidad": 1, "situaciones": {"A": {"titulo": "La última llamada", "unidad": 1, "leccion": 4, "rotulo": "Actividad práctica: retiro voluntario o desaparición forzada", "reflexion": false, "contexto": "<p>Carlos Alberto Morales, de 34 años de edad, de ocupación transportador rural y reconocido líder comunal en la región. El 14 de marzo de 2026, a las 17:00 horas, Carlos Alberto salió en su camioneta Toyota Hilux (placas <strong>XYZ-789<\/strong>) desde el casco urbano de San José de las Peñas con destino a la vereda La Esperanza. A las 18:02 horas, el dispositivo móvil de Carlos registró la última llamada saliente hacia su esposa a través de la celda <strong>\"San José Urbano\"<\/strong>. A las 18:45 horas, la terminal captó tráfico de datos en la radio estación <em>\"SJP-Sector El Vergel\"<\/em> y, a las 19:12 horas, se produjo la desconexión abrupta del teléfono por pérdida de energía o extracción de batería en la zona de la <em>Finca El Vergel.<\/em><\/p><p>Pasadas las 18:15 horas del 14 de marzo, en el sector del antiguo estadero <em>El Mirador<\/em>, un camión de estacas bloqueó la vía. Cuatro sujetos con chalecos negros sin insignias y armas largas interceptaron la camioneta, bajaron a Carlos violentamente y lo subieron a la cabina del camión. Pobladores del sector señalaron que una patrulla policial pasó 20 minutos después por el lugar sin atender las llamadas de auxilio de la comunidad.<\/p><p>Al no tener noticias de su hijo durante la noche, la señora Rosa Elena Morales acudió el 15 de marzo de 2026 a las 08:30 horas a la Subestación de Policía de San José de las Peñas. El comandante de guardia registró en el libro de población: <em>\"Posible retiro voluntario del hogar por deudas comerciales o desavenencias personales. Se sugiere a la familia esperar 72 horas para interponer denuncia formal\"<\/em>.<\/p>", "consigna": "<ol><li>¿Es procedente calificar el hecho preliminarmente como \"retiro voluntario\" o existen indicios para sospechar la comisión de un delito de desaparición forzada (Art. 165 C.P.)<\/li><li>¿Qué información falta y qué actuación inmediata debe seguirse?<\/li><\/ol>", "opciones": [{"letra": "A", "texto": "Actuación inmediata y de oficio", "textoPlano": "Actuación inmediata y de oficio", "retro": "<p><strong>¡Correcto!<\/strong> La desaparición de un líder comunal en un trayecto rural exige activar inmediatamente la búsqueda de oficio e investigación penal bajo el principio de presunción de vida (Arts. 12 y 250 C.P., Sentencia C-317 de 2002). La autoridad debe desplegar acciones inmediatas para reconstruir la UTC, tomar entrevistas a testigos clave en la ruta, asegurar los registros de la radio estación telefónica e inspeccionar el lugar de los hechos.<\/p>", "correcta": true}, {"letra": "B", "texto": "Esperar las 72 horas por no haber certeza de violencia", "textoPlano": "Esperar las 72 horas por no haber certeza de violencia", "retro": "<p><strong>Incorrecto.<\/strong> Asumir un \"retiro voluntario\" por supuestas deudas constituye un estereotipo institucional revictimizante que invalida la respuesta inicial. Exigir un plazo de 72 horas vulnera el marco normativo colombiano (Ley 589 de 2000 y Ley 971 de 2005) y provoca la pérdida irreparable de evidencia técnica volátil, tales como la geolocalización de celdas en el sector <em>El Vergel<\/em> y los testimonios de los habitantes en el sector <em>El Mirador<\/em>.<\/p>", "correcta": false}], "plantilla": "", "pregunta": "", "retroPregunta": "", "video": "medios/dfz-situacion-a.mp4", "videoDisponible": true, "imagen": ""}, "B": {"titulo": "La nota sobre la cama", "unidad": 1, "leccion": 2, "rotulo": "Actividad práctica: nota manuscrita y desaparición voluntaria", "reflexion": false, "contexto": "<p>Julián David Morales, joven de 22 años, habitante de la zona urbana de San José de las Peñas, técnico en mantenimiento de vehículos y amigo cercano de jóvenes del sector rural. El 20 de marzo de 2026, la familia de Julián encuentra una nota manuscrita sobre su cama en la que se lee: <em>\"Me voy de la ciudad a buscar trabajo por mi cuenta. No me busquen, estoy bien y fue mi decisión\"<\/em>.<\/p><p>Pese a la existencia de la nota, la madre y dos allegados de Julián declaran bajo reserva que, durante las tres semanas previas a su ausencia, el joven mostró severos cambios de conducta, insomnio y estados de ansiedad. Allegados señalan que miembros del grupo armado ilegal <em>Bloque Central Renacer<\/em> (que opera en los corredores rurales hacia la vereda La Esperanza) lo venían presionando e intimidando para que se vinculara a la estructura criminal como mecánico de su flotilla de vehículos y apoyara labores logísticas.<\/p><p>La víspera de su desaparición, a las 21:30 horas, un compañero de trabajo observó a Julián recibir una llamada telefónica visiblemente alterado, tras la cual afirmó: <strong>\"Si no me presento mañana a las 06:00 a.m. en el cruce de El Vergel, se meten con mi familia\"<\/strong>.<\/p><p>Al acudir a la autoridad receptora, el funcionario de atención sugiere no abrir noticia criminal sosteniendo que <strong>\"hay una nota clara firmada por el joven que prueba que se fue por su propia voluntad y que es mayor de edad\"<\/strong>.<\/p>", "consigna": "<ol><li>¿Es metodológicamente correcto dar por sentada una \"desaparición voluntaria\" basándose únicamente en la existencia de una nota epistolar manuscrita?<\/li><li>¿De qué manera la coerción, el reclutamiento forzado o las amenazas veladas anulan la autonomía de la voluntad y obligan a considerar hipótesis delictivas?<\/li><li>¿Qué diligencias inmediatas debe ordenar el investigador para verificar si la nota fue redactada bajo coacción o si se trata de una maniobra de desorientación desplegada por el grupo armado?<\/li><\/ol>", "opciones": [{"letra": "A", "texto": "Aceptar la nota manuscrita como prueba definitiva de desaparición voluntaria y abstenerse de investigar", "textoPlano": "Aceptar la nota manuscrita como prueba definitiva de desaparición voluntaria y abstenerse de investigar", "retro": "<ul><li><strong>Incorrecto.<\/strong> Asumir de manera prematura una \"desaparición voluntaria\" basándose de forma exclusiva en una nota constituye un grave error metodológico y una falla al estándar de debida diligencia.<\/li><li>Como lo establece la Lección 2 de la Unidad 1, una aparente desaparición voluntaria jamás debe asumirse sin verificación previa, pues frecuentemente enmascara situaciones de coerción, amenazas de muerte, reclutamiento forzado o maniobras de engaño y desorientación perpetradas por actores armados.<\/li><li>Desestimar los testimonios de los allegados sobre las presiones del grupo armado <em>Bloque Central Renacer<\/em> para validar únicamente la nota manuscrita configura un <strong>sesgo de confirmación<\/strong>. Esta omisión neutraliza la búsqueda urgente e impide asegurar evidencias volátiles como la triangulación de la llamada recibida a las 21:30 horas<\/li><\/ul>", "correcta": false}, {"letra": "B", "texto": "Rechazar la hipótesis de voluntariedad automática, aperturar la investigación y verificar la existencia de coerción o delito", "textoPlano": "Rechazar la hipótesis de voluntariedad automática, aperturar la investigación y verificar la existencia de coerción o delito", "retro": "<ul><li><strong>¡Correcto!<\/strong> El investigador debe diferenciar la \"desaparición como hecho\" de la \"calificación jurídica preliminar\", manteniendo abiertas de manera objetiva las hipótesis de coerción, reclutamiento forzado o desaparición forzada.<\/li><li>La libertad de decisión exige la ausencia total de coacción física o psicológica. Ante indicios de presiones por parte de un grupo armado ilegal, la autoridad debe actuar de oficio bajo el principio de presunción de vida.<\/li><li>Procede realizar de inmediato la toma de muestras de grafología/cotejo caligráfico sobre la nota para determinar si fue escrita bajo estrés o coacción; ordenar el análisis de celdas y tráfico de llamadas del dispositivo móvil de Julián; realizar entrevistas detalladas al entorno laboral y social; e inspeccionar el punto de interceptación señalado en el cruce de <em>El Vergel.<\/em><\/li><\/ul>", "correcta": true}], "plantilla": "", "pregunta": "", "retroPregunta": "", "video": "medios/dfz-situacion-b.mp4", "videoDisponible": true, "imagen": ""}, "C": {"titulo": "El plazo de 24 horas", "unidad": 1, "leccion": 2, "rotulo": "Actividad práctica: secuestro extorsivo o desaparición forzada", "reflexion": false, "contexto": "<p>Fernando Ruiz, de 45 años, reconocido comerciante de insumos agrícolas y propietario de un almacén en el casco urbano de San José de las Peñas.<\/p><p>El 5 de abril de 2026, a las 14:30 horas, Fernando transitaba en su vehículo particular por la periferia urbana de San José de las Peñas hacia la salida a la vereda La Esperanza. Es interceptado de forma violenta por dos sujetos armados que descendieron de una motocicleta, lo obligaron a bajar de su automóvil a la fuerza y lo abordaron en un camión cerrado que huyó con rumbo desconocido.<\/p><p>Dos horas después de la interceptación (16:30 horas), la esposa de Fernando recibe una llamada telefónica de un número desconocido. Un hombre afirma tener en su poder a Fernando, exige la suma de $150.000.000 de pesos a cambio de respetarle la vida, aporta un detalle específico de las prendas que vestía la víctima como prueba de supervivencia y fija un plazo de 24 horas para la entrega del dinero en un punto rural.<\/p><p>En el municipio circulan rumores sobre presuntos \"cobros de deudas\" y extorsiones por parte de delincuentes comunes y del grupo armado ilegal <em>Bloque Central Renacer<\/em>.<\/p><ul><li>Al recibir el reporte, el analista de denuncias duda si ingresar la noticia criminal bajo el delito de <em>Desaparición Forzada<\/em> (Art. 165 C.P.) o remitiendo inmediatamente la carpeta al grupo GAULA por el delito de <em>Secuestro Extorsivo<\/em> (Art. 169 C.P.)<\/li><\/ul>", "consigna": "<ol><li>¿Cuáles son los elementos jurídico-penales que diferencian el Secuestro Extorsivo del delito de Desaparición Forzada según la Lección 2 y el Código Penal Colombiano?<\/li><li>¿El hecho de que exista una exigencia económica explicita descarta automáticamente y de manera definitiva la hipótesis de desaparición forzada?<\/li><li>Manejo de hipótesis y debida diligencia: ¿Cómo debe actuar el investigador para evitar una \"visión de túnel\" o un \"anclaje\" prematuro, garantizando la búsqueda urgente mientras se determina la competencia adecuada?<\/li><\/ol>", "opciones": [{"letra": "A", "texto": "Calificar el hecho de forma exclusiva y definitiva como Desaparición Forzada, ignorando la llamada extorsiva", "textoPlano": "Calificar el hecho de forma exclusiva y definitiva como Desaparición Forzada, ignorando la llamada extorsiva", "retro": "<ul><li><strong>Incorrecto.<\/strong> Omitir la exigencia económica del análisis constituye un error metodológico que desconoce los elementos del tipo penal de <em>Secuestro Extorsivo<\/em> (Art. 169 C.P.).<\/li><li>En la desaparición forzada, el elemento característico es la privación de libertad seguida del <strong>ocultamiento deliberado, la negativa a reconocer la detención o la falta de información sobre el paradero<\/strong>, sustrayendo a la víctima de la protección de la ley. En el secuestro extorsivo, el propósito explícito y central es la <strong>exigencia de un provecho o suma de dinero<\/strong> a cambio de la liberación o de la vida. Ignorar la exigencia de dinero impediría activar los protocolos especializados de interceptación de llamadas extorsivas e inteligencia operativa.<\/li><\/ul>", "correcta": false}, {"letra": "B", "texto": "Calificar preliminarmente como Secuestro Extorsivo, pero manteniendo una línea investigativa abierta frente a una posible maniobra de engaño o derivación a Desaparición Forzada", "textoPlano": "Calificar preliminarmente como Secuestro Extorsivo, pero manteniendo una línea investigativa abierta frente a una posible maniobra de engaño o derivación a Desaparición Forzada", "retro": "<ul><li><strong>¡Correcto!<\/strong> Fácticamente, la existencia de una llamada solicitando dinero con prueba de vida ubica el caso, de manera preliminar, en la órbita del <strong>Secuestro Extorsivo<\/strong>. Sin embargo, la debida diligencia obliga a mantener la flexibilidad investigativa.<\/li><li>En contextos de violencia territorial como San José de las Peñas, es frecuente que delincuentes comunes extorsionen a la familia al enterarse del hecho, o que los mismos perpetradores simulen un secuestro para ganar tiempo, cobrar dinero y posteriormente ejecutar y ocultar el cuerpo.<\/li><li>Procede asignar la investigación al equipo de Secuestro (GAULA), pero realizando de inmediato la <strong>geolocalización y triangulación de la llamada extorsiva<\/strong>, la preservación de celdas de telefonía en la ruta de interceptación y el registro en el RND/SIRDEC bajo la presunción de vida, evitando el cierre prematuro de otras hipótesis<\/li><\/ul>", "correcta": true}], "plantilla": "", "pregunta": "", "retroPregunta": "", "video": "medios/dfz-situacion-c.mp4", "videoDisponible": true, "imagen": ""}, "D": {"titulo": "La creciente de La Miel", "unidad": 1, "leccion": 2, "rotulo": "Actividad práctica: desaparición accidental o desaparición forzada", "reflexion": false, "contexto": "<p>Manuel Antonio Gómez, de 58 años, agricultor tradicional y habitante de la vereda <em>La Esperanza<\/em> en el municipio de San José de las Peñas.<\/p><p>El 12 de abril de 2026, durante una fuerte tormenta tropical que provocó la creciente de varios afluentes de la región, Manuel Antonio salió a las 16:00 horas desde el casco urbano hacia su finca montado en su mulo de carga. Para llegar a su predio debía cruzar el paso del vado de la quebrada <em>La Miel<\/em>, sector caracterizado por crecientes torrenciales intempestivas.<\/p><p>A las 07:00 horas del día siguiente (13 de abril), vecinos de la zona encuentran al mulo con la enjalma desprendida y húmeda al otro lado de la ribera de la quebrada, junto con el sombrero de Don Manuel atascado entre unas palizadas a 300 metros río abajo. Sin embargo, no se observa rastro del agricultor.<\/p><p>Aunque el evento climático sugiere un arrastre de corriente por crecida del río, la familia señala que Don Manuel conocía perfectamente el río y nunca lo cruzaba si estaba crecido. Además, dos meses atrás había tenido discrepancias de linderos con un habitante de la zona vinculado al grupo armado <em>Bloque Central Renacer<\/em>.<\/p><p>La familia acude al puesto de policía y al despacho judicial a reportar la ausencia. El funcionario de turno rechaza recibir el reporte formal como noticia criminal argumentando: <em>\"Eso fue un ahogamiento por imprudencia invernal. La Fiscalía investiga delitos, no accidentes climáticos. Vayan a la Defensa Civil o al Comité de Gestión del Riesgo para que manden buzos o rescate\"<\/em>.<\/p>", "consigna": "<ol><li>Conforme a la Lección 2 de la Unidad 1, ¿de qué manera se diferencia la desaparición por evento accidental o natural de la desaparición forzada?<\/li><li>¿Es correcto descartar de plano y desde el primer momento la actuación de la autoridad penal y la apertura de indagación basándose exclusivamente en la hipótesis del accidente natural?<\/li><li>¿Cómo se articula el deber del Estado de búsqueda inmediata con la obligación de verificar preliminarmente si existió intervención de terceros o una simulación de accidente?<\/li><\/ol>", "opciones": [{"letra": "A", "texto": "Rechazar el caso en sede penal y remitir de forma exclusiva la búsqueda a los organismos de socorro por tratarse de un hecho accidental", "textoPlano": "Rechazar el caso en sede penal y remitir de forma exclusiva la búsqueda a los organismos de socorro por tratarse de un hecho accidental", "retro": "<ul><li><strong>Incorrecto.<\/strong> Abstenerse de registrar la información y negar el abordaje inicial constituye una falla en la valoración del riesgo y en el deber de coordinación interinstitucional.<\/li><li>Asumir de entrada que la ausencia se debe a un ahogamiento por desastre natural, ignorando las discrepancias de linderos y las amenazas previas reportadas por la familia, incurre en un <strong>sesgo de confirmación<\/strong>.<\/li><li>Aunque fácticamente la hipótesis de accidente en el río sea plausible, las autoridades receptoras deben ingresar los datos al Registro Nacional de Desaparecidos (RND - SIRDEC) y coordinar inmediatamente con los organismos de socorro y la policía judicial. Negar la atención institucional basándose en la tipificación previa del hecho vulnera el derecho de la familia a la búsqueda inmediata y a la determinación de la suerte o paradero de su ser querido.<\/li><\/ul>", "correcta": false}, {"letra": "B", "texto": "Ingresar el reporte, activar de inmediato la búsqueda en articulación con organismos de gestión del riesgo y realizar verificaciones preliminares de campo", "textoPlano": "Ingresar el reporte, activar de inmediato la búsqueda en articulación con organismos de gestión del riesgo y realizar verificaciones preliminares de campo", "retro": "<ul><li><strong>¡Correcto!<\/strong> La actuación diligente exige iniciar la búsqueda sin dilación y de manera coordinada, manteniendo abiertas de manera objetiva las hipótesis de accidente y de posible intervención de terceros.<\/li><li>Como se señala en la Lección 2 de la Unidad 1, en la desaparición accidental el paradero es desconocido debido a eventos naturales o fortuitos (caídas, crecientes, naufragios) sin que concurra necesariamente delito. Sin embargo, metodológicamente, la \"desaparición como hecho\" debe ser abordada con inmediatez bajo la <strong>presunción de vida<\/strong>.<\/li><li><em>Acciones inmediatas requeridas:<\/em><ol><li>Registros obligatorios en el RND/SIRDEC y activación de la cadena de búsqueda con los Comités de Gestión del Riesgo, Bomberos y Defensa Civil para el rastreo del cauce de la quebrada <em>La Miel<\/em>.<\/li><li>Inspección técnica de campo en el sitio del hallazgo del sombrero y del animal por parte de policía judicial, verificando la presencia de huellas de calzado, signos de violencia o rastros de vehículos en ambas riberas.<\/li><li>Entrevistas iniciales al entorno cercano y verificación de las amenazas previas para descartar o confirmar si el accidente fue provocado o utilizado como maniobra de encubrimiento.<\/li><\/ol><\/li><\/ul>", "correcta": true}], "plantilla": "", "pregunta": "", "retroPregunta": "", "video": "medios/dfz-situacion-d.mp4", "videoDisponible": true, "imagen": ""}, "E": {"titulo": "El camión hacia El Vergel", "unidad": 1, "leccion": 3, "rotulo": "Actividad práctica: homicidio y desaparición forzada", "reflexion": false, "contexto": "<p>Gustavo Adolfo Ramírez, de 38 años, comerciante de ganado y habitante de la vereda <em>La Esperanza<\/em> en el municipio de San José de las Peñas.<\/p><p>El 28 de abril de 2026, a las 17:30 horas, mientras Gustavo Adolfo caminaba cerca del antiguo estadero <em>El Mirador<\/em>, es abordado por dos sujetos armados que descendieron de una motocicleta. Tras una breve discusión verbal, uno de los atacantes le dispara en dos oportunidades a la altura del tórax y la cabeza.<\/p><p>Testigos presenciales (comerciantes y transeúntes del sector) observan cómo, de forma inmediata, un vehículo tipo camión de estacas se atraviesa en la vía. Los dos agresores suben a Gustavo Adolfo —quien se encontraba sangrando profusamente y sin signos aparentes de movilidad— a la parte trasera del vehículo y huyen a alta velocidad con rumbo a los callejones rurales de la <em>Finca El Vergel<\/em>.<\/p><p>Pese a los patrullajes y a las llamadas de auxilio de los testigos, el vehículo desaparece de la vista. Transcurridas 72 horas, no se ha recibido comunicación de los perpetradores, no ha ingresado ningún cuerpo con esas características a los centros hospitalarios ni a la morgue municipal, ni se conoce el lugar donde fue depositado o inhumado el cuerpo de Gustavo Adolfo.<\/p><p>Al recibir el reporte, el fiscal de turno califica provisionalmente las diligencias de manera exclusiva como <em>\"Homicidio Agravado\"<\/em> y remite la carpeta al despacho seccional de delitos contra la vida, sosteniendo que <em>\"como hubo testigos de los disparos fatales, el hecho ya se consumó como homicidio y no corresponde a un caso de desaparición, por lo que no procede activar la búsqueda sino esperar la aparición fortuita del cadáver\"<\/em>.<\/p>", "consigna": "<ol><li>Conforme a la Lección 2 de la Unidad 1, ¿por qué el presunto deceso o la observación de violencia letal no descarta automáticamente la configuración del delito de <strong>Desaparición Forzada<\/strong> (Art. 165 C.P.)?<\/li><li>¿Por qué la simple noticia o deducción de la muerte de la víctima <strong>no cesa la conducta de desaparición forzada<\/strong> mientras persista el ocultamiento y no hayan sido hallados e identificados científicamente los restos?<\/li><li>¿Qué obligaciones de búsqueda, prospección arqueológica e investigación con debida diligencia se activan de oficio tanto para la tipificación penal como para la satisfacción de los derechos de las víctimas?<\/li><\/ol>", "opciones": [{"letra": "A", "texto": "Calificar el hecho de forma exclusiva como homicidio, cerrar la línea de búsqueda e investigación por desaparición y esperar a que la policía encuentre el cuerpo incidentalmente", "textoPlano": "Calificar el hecho de forma exclusiva como homicidio, cerrar la línea de búsqueda e investigación por desaparición y esperar a que la policía encuentre el cuerpo incidentalmente", "retro": "<ul><li><strong>Incorrecto.<\/strong> Asumir que la presencia de disparos transforma el hecho en un simple homicidio y suspende la búsqueda urgente constituye una grave falla al estándar de <strong>debida diligencia<\/strong> y una lectura sesgada del tipo pena.<\/li><li>En la práctica criminal (como se documenta en el expediente de <em>San José de las Peñas<\/em> con los hallazgos de fosas clandestinas en la <em>Finca El Vergel<\/em>), el ataque armado seguido del traslado coercitivo y ocultamiento deliberado del cuerpo constituye una estrategia de poder orientada a borrar la evidencia y garantizar la impunidad.<\/li><li>Privar a la persona de la vida y simultáneamente ocultar su cadáver sustrae a la víctima de la protección de la ley y sume a sus familiares en la <strong>incertidumbre prolongada<\/strong>. Reducir el caso a un homicidio estático sin búsqueda activa paraliza las labores de policía judicial para la ubicación de fosas clandestinas y el aseguramiento de celdas y cámaras.<\/li><\/ul>", "correcta": false}, {"letra": "B", "texto": "Ingresar el hecho bajo la hipótesis de Desaparición Forzada en concurso con Homicidio, activando de inmediato la búsqueda urgente, la reconstrucción de la UTC y las labores de prospección forense", "textoPlano": "Ingresar el hecho bajo la hipótesis de Desaparición Forzada en concurso con Homicidio, activando de inmediato la búsqueda urgente, la reconstrucción de la UTC y las labores de prospección forense", "retro": "<ul><li><strong>¡Correcto!<\/strong> Como lo establece la jurisprudencia de la Corte Constitucional (Sentencia SU-168 de 2023) y la Lección 2 de la Unidad 1, la desaparición forzada es un delito de carácter <strong>permanente o continuado<\/strong> que no cesa por la simple presunción o manifestación de muerte.<\/li><li>Mientras los restos humanos no hayan sido localizados, exhumados con rigor arqueológico e identificados científicamente (mediante cotejo genético/ADN o perfil antropológico), subsiste la <strong>obligación estatal ineludible de buscar e investigar de oficio<\/strong>.<\/li><li><em>Acciones inmediatas requeridas:<\/em><ol><li><strong>Reconstrucción urgente de la UTC:<\/strong> Asegurar las cámaras del sector <em>El Mirador<\/em>, solicitar el tráfico de celdas telefónicas de las radioestaciones que cubren la ruta hacia la <em>Finca El Vergel<\/em> y tomar declaraciones detalladas a los testigos presenciales.<\/li><li><strong>Investigación forense en terreno:<\/strong> Diseñar la hipótesis espacial para la localización de posibles puntos de inhumación clandestina o fosas en predios rurales del sector, aplicando los estándares del Protocolo de Minnesota.<\/li><li><strong>Ingreso al RND/SIRDEC:<\/strong> Registrar la <strong>información ante mortem (AM)<\/strong> entregada por los familiares para un eventual cotejo post mortem (PM).<\/li><\/ol><\/li><\/ul>", "correcta": true}], "plantilla": "", "pregunta": "", "retroPregunta": "", "video": "medios/dfz-situacion-e.mp4", "videoDisponible": true, "imagen": ""}}}</script>
