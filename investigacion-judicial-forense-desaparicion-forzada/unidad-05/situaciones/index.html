anclaje/confirmación)<\/em><\/td><\/tr><tr><td><strong>Entrevista I-02 (T-01)<\/strong> <em>(Testigo del retén e interceptación)<\/em><\/td><td><em>(Clasifique el tipo de evidencia)<\/em><\/td><td><em>(Identifique la pregunta sobre la UTC)<\/em><\/td><td><em>(Evalúe la capacidad demostrativa)<\/em><\/td><td><em>(Señale las limitaciones de la memoria/miedo)<\/em><\/td><\/tr><tr><td><strong>Informe SDR I-03<\/strong> <em>(Celdas telefónicas El Vergel)<\/em><\/td><td><em>(Clasifique la evidencia digital/técnica)<\/em><\/td><td><em>(Identifique la pregunta sobre ubicación)<\/em><\/td><td><em>(Evalúe qué prueba el tráfico de celdas)<\/em><\/td><td><em>(Mencione qué no puede probar el dato técnico)<\/em><\/td><\/tr><tr><td><strong>Dictamen AF-048 I-06<\/strong> <em>(Antropología / Lesiones)<\/em><\/td><td><em>(Clasifique la evidencia forense/ósea)<\/em><\/td><td><em>(Identifique la pregunta de identificación/causa)<\/em><\/td><td><em>(Evalúe el perfil biológico y la traumatología)<\/em><\/td><td><em>(Señale por qué orienta pero no individualiza por sí solo)<\/em><\/td><\/tr><tr><td><strong>Dictamen GEN-109 I-07<\/strong> <em>(Cotejo ADN Maternidad)<\/em><\/td><td><em>(Clasifique la evidencia biológica/genética)<\/em><\/td><td><em>(Identifique la pregunta de identidad positiva)<\/em><\/td><td><em>(Evalúe la probabilidad del 99.9999%)<\/em><\/td><td><em>(Mencione los supuestos estadísticos requeridos)<\/em><\/td><\/tr><\/table><\/div>", "pregunta": "", "retroPregunta": "", "video": "", "videoDisponible": false, "imagen": "img/dfz-situacion-j.jpg", "plantillaTitulo": "Plantilla descargable", "plantillaNombre": "Matriz de Clasificación y Valoración de la Evidencia", "xlsx": "documentos/dfz-situacion-j-matriz-clasificacion-evidencia.xlsx", "xlsxPeso": "6 KB"}, "K": {"titulo": "El informe integral", "unidad": 5, "leccion": 7, "rotulo": "Actividad de reflexión", "reflexion": true, "contexto": "<p>Ha culminado la recolección de pruebas en el caso de Carlos Alberto Morales (Documentos I-01 a I-08) y la atención de la emergencia de su hermana Mariana Morales (Sub-caso I-09). Como equipo interdisciplinario (Fiscal, Investigador CTI, Perito Forense y Analista de Contexto), deben consolidar la información fragmentada y elaborar el <strong>Informe Integral de Esclarecimiento del Caso<\/strong>.<\/p>", "consigna": "<p>Revise la totalidad de las piezas del expediente y redacte el <strong>Informe Integral de Esclarecimiento de 20 Puntos<\/strong>, completando la estructura estandarizada de los 20 numerales obligatorios. Debe clasificar los hechos en esclarecidos, parcialmente esclarecidos, pendientes y controvertidos, y preparar la sustentación oral del caso.<\/p>", "opciones": [], "plantilla": "<div class=\"tabla-marco\"><table class=\"tabla\"><tr><td>1. Identificación del problema investigativo y calificación jurídica preliminar (Art. 165 C.P.).<\/td><\/tr><tr><td>2. Antecedentes, contexto sociopolítico y dinámica territorial de San José de las Peñas.<\/td><\/tr><tr><td>3. Reconstrucción de la línea temporal fáctica detallada (Última Trayectoria Conocida - UTC).<\/td><\/tr><tr><td>4. Delimitación de lugares de interés e hipótesis espacial (Finca El Vergel).<\/td><\/tr><tr><td>5. Formulación y evolución de hipótesis competidoras (H1: Retiro vs H2: Desaparición / Homicidio).<\/td><\/tr><tr><td>6. Inventario, cadena de custodia y caracterización de la evidencia física y digital.<\/td><\/tr><tr><td>7. Análisis jurídico de los elementos constitutivos del tipo penal (privación, ocultamiento, sustracción).<\/td><\/tr><tr><td>8. Análisis criminalístico del escenario de hallazgo y prospección (GPR y estratigrafía).<\/td><\/tr><tr><td>9. Análisis médico-forense, odontológico y traumatología ósea (Mecanismo de muerte PAF).<\/td><\/tr><tr><td>10. Análisis contextual, matriz de asociación (AC-003) y patrón macrocriminal.<\/td><\/tr><tr><td>11. Proceso de Identificación Humana (Cotejo genético STRs / ADN Maternidad 99.9999%).<\/td><\/tr><tr><td>12. Reconstrucción integral de la trayectoria de la víctima y destino final.<\/td><\/tr><tr><td>13. Contrastación crítica de hipótesis competidoras y eliminación de sesgos.<\/td><\/tr><tr><td>14. Determinación de hechos plenamente esclarecidos.<\/td><\/tr><tr><td>15. Determinación de hechos parcialmente esclarecidos.<\/td><\/tr><tr><td>16. Determinación de hechos pendientes por esclarecer.<\/td><\/tr><tr><td>17. Análisis de contradicciones y divergencias testimoniales (T-01 vs T-02).<\/td><\/tr><tr><td>18. Limitaciones técnicas, científicas e incertidumbres persistentes.<\/td><\/tr><tr><td>19. Plan de nuevas actuaciones, órdenes a Policía Judicial y MBU/Alerta Rosa (Sub-caso I-09).<\/td><\/tr><tr><td>20. Conclusiones integrales, nivel de respuesta a las víctimas y reparación.<\/td><\/tr><\/table><\/div>", "pregunta": "", "retroPregunta": "", "video": "", "videoDisponible": false, "imagen": "img/dfz-situacion-k.jpg", "plantillaTitulo": "Estructura descargable", "plantillaNombre": "Estructura del informe integral de esclarecimiento del caso (20 numerales)", "xlsx": "documentos/dfz-situacion-k-estructura-informe-integral.xlsx", "xlsxPeso": "6 KB"}}}</script>
